<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Molecular Visualizer • Ball-and-Stick</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root{color-scheme:dark} html,body{height:100%;margin:0}
    body{background:#0f1012;color:#e9eaee;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial,sans-serif}
    .wrap{max-width:1200px;margin:24px auto;padding:0 20px}
    h1{margin:0 0 6px;font-weight:700}
    .meta{display:inline-block;padding:6px 10px;border-radius:10px;background:#1a1c22;border:1px solid #2b2f3a;font-size:12px;color:#b9beca;margin:4px 0 14px}
    .controls{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;margin:8px 0 12px}
    .btn{padding:8px 12px;border:1px solid #2b2f3a;background:#1a1c22;color:#e9eaee;border-radius:8px;cursor:pointer;font-weight:600}
    .viewer{position:relative;background:#0b0c0f;border:1px solid #2b2f3a;border-radius:10px;height:min(72vh,680px);overflow:hidden}
    #canvas{width:100%;height:100%;display:block}
    
    /* Atom Info Panel */
    #infoPanel{
      position:absolute;
      top:80px;
      right:20px;
      width:300px;
      background:rgba(26, 28, 34, 0.95);
      border:1px solid #2b2f3a;
      border-radius:10px;
      padding:16px;
      display:none;
      z-index:100;
      box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    .atom-info-panel h3{
      margin:0 0 12px 0;
      color:#e9eaee;
      font-size:16px;
      font-weight:600;
    }
    
    .info-section{
      margin-bottom:10px;
      color:#b9beca;
      font-size:13px;
      line-height:1.5;
    }
    
    .info-section strong{
      color:#e9eaee;
    }
    
    .close-btn{
      width:100%;
      padding:8px;
      margin-top:8px;
      background:#263043;
      color:#fff;
      border:1px solid #2b2f3a;
      border-radius:6px;
      cursor:pointer;
      font-size:13px;
    }
    
    .close-btn:hover{
      background:#2d3a4f;
    }
    
    /* Top Contacts Panel */
    #contactsPanel{
      position:absolute;
      top:80px;
      left:20px;
      width:280px;
      max-height:400px;
      background:rgba(26, 28, 34, 0.95);
      border:1px solid #2b2f3a;
      border-radius:10px;
      padding:16px;
      display:none;
      z-index:100;
      overflow-y:auto;
      box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    #contactsPanel h3{
      margin:0 0 12px 0;
      color:#e9eaee;
      font-size:16px;
      font-weight:600;
    }
    
    .contact-item{
      padding:8px;
      margin-bottom:6px;
      background:#1f232b;
      border-radius:6px;
      cursor:pointer;
      font-size:12px;
      color:#b9beca;
    }
    
    .contact-item:hover{
      background:#2d3a4f;
    }
    
    /* Clip Plane Controls */
    #clipPlaneControls{
      position:absolute;
      top:80px;
      right:340px;
      width:280px;
      background:rgba(26, 28, 34, 0.95);
      border:1px solid #2b2f3a;
      border-radius:10px;
      padding:16px;
      display:none;
      z-index:100;
      box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    #clipPlaneControls h3{
      margin:0 0 12px 0;
      color:#e9eaee;
      font-size:16px;
      font-weight:600;
    }
    
    .clip-control{
      margin-bottom:12px;
    }
    
    .clip-control label{
      color:#b9beca;
      font-size:13px;
      margin-bottom:4px;
      display:block;
    }
    
    .clip-select{
      width:100%;
      padding:6px;
      background:#1f232b;
      color:#e9eaee;
      border:1px solid #2b2f3a;
      border-radius:6px;
      font-size:13px;
    }
    
    /* Measurements Panel */
    #measurementsPanel{
      position:absolute;
      bottom:20px;
      left:20px;
      width:280px;
      max-height:300px;
      background:rgba(26, 28, 34, 0.95);
      border:1px solid #2b2f3a;
      border-radius:10px;
      padding:16px;
      display:none;
      z-index:100;
      overflow-y:auto;
      box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    #measurementsPanel h3{
      margin:0 0 12px 0;
      color:#e9eaee;
      font-size:16px;
      font-weight:600;
    }
    
    .measurement-item{
      padding:8px;
      margin-bottom:6px;
      background:#1f232b;
      border-radius:6px;
      font-size:12px;
      color:#b9beca;
    }
    
    /* Export Menu */
    #exportMenu{
      position:absolute;
      top:180px;
      left:20px;
      width:200px;
      background:rgba(26, 28, 34, 0.95);
      border:1px solid #2b2f3a;
      border-radius:8px;
      padding:8px;
      display:none;
      z-index:1000;
      box-shadow:0 8px 32px rgba(0, 0, 0, 0.4);
    }
    
    .menu-btn{
      width:100%;
      padding:8px 12px;
      margin-bottom:4px;
      border:1px solid #2b2f3a;
      background:#1f232b;
      color:#e9eaee;
      border-radius:6px;
      cursor:pointer;
      font-size:13px;
      text-align:left;
    }
    
    .menu-btn:hover{
      background:#2d3a4f;
    }
    
    .menu-btn:last-child{
      margin-bottom:0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Ball-and-Stick</h1>
    <div class="meta" id="metaPill">frames: — • atoms: — • residues: —</div>
    <div class="controls">
      <div style="display:flex;gap:10px;align-items:center">
        <span style="opacity:.75;font:12px/1 monospace">frame</span>
        <input id="slider" type="range" min="0" max="0" step="1" value="0" />
        <span id="frameLbl" style="min-width:28px;text-align:right;font:12px/1 monospace">0</span>
      </div>
      <button class="btn" id="btnLoad">Load frame</button>
      <button class="btn" id="btnPlay">Play</button>
      <button class="btn" id="btnPause" disabled>Pause</button>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <button class="btn" id="btnToggleRMSF">Show RMSF</button>
      <button class="btn" id="btnToggleContacts">Show Contacts</button>
      <button class="btn" id="btnShowContacts">Top Contacts</button>
      <button class="btn" id="btnToggleClipping">Enable Clipping</button>
      <button class="btn" id="btnToggleMeasure">Measure Distance</button>
      <button class="btn" id="btnExport">Export ▼</button>
    </div>
    <div class="viewer"><canvas id="canvas"></canvas></div>
    <div id="status" style="margin-top:8px;font:12px/1.3 monospace;color:#9aa3b2">initializing…</div>
  </div>

  <!-- Atom Info Panel -->
  <div id="infoPanel"></div>

  <!-- Top Contacts Panel -->
  <div id="contactsPanel">
    <h3>Top Interacting Residues</h3>
    <div id="contactsList"></div>
    <button id="closeContactsBtn" class="close-btn">Close</button>
  </div>

  <!-- Clip Plane Controls -->
  <div id="clipPlaneControls">
    <h3>Clip Plane Controls</h3>
    
    <div class="clip-control">
      <label>Plane 1 - Axis</label>
      <select id="clip1Axis" class="clip-select">
        <option value="x">X-Axis</option>
        <option value="y" selected>Y-Axis</option>
        <option value="z">Z-Axis</option>
      </select>
    </div>
    
    <div class="clip-control">
      <label>Position: <span id="clip1Value">0</span></label>
      <input type="range" id="clip1Slider" min="-50" max="50" value="0" step="0.5" style="width:100%;" />
    </div>
    
    <div style="margin-top:16px;display:flex;gap:8px;">
      <button class="btn" id="btnAddPlane" style="flex:1;">Add Plane</button>
      <button class="btn" id="btnResetPlanes" style="flex:1;">Reset</button>
    </div>
    
    <div style="margin-top:8px;">
      <label style="color:#b9beca;font-size:12px;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="chkPlaneHelpers" checked />
        Show plane helpers
      </label>
    </div>
    
    <button id="closeClipBtn" class="close-btn">Close</button>
  </div>

  <!-- Measurements Panel -->
  <div id="measurementsPanel">
    <h3>Measurements</h3>
    <div id="measurementsList">
      <div style="color:#9aa3b2;font-size:12px;text-align:center;">No measurements yet</div>
    </div>
    
    <div style="margin-top:12px;">
      <label style="color:#b9beca;font-size:12px;display:flex;align-items:center;gap:6px;">
        <input type="checkbox" id="chkPersistMeasurements" />
        Persist across frames
      </label>
    </div>
    
    <button class="btn" id="btnClearMeasurements" style="margin-top:12px;width:100%;">
      Clear All
    </button>
  </div>

  <!-- Export Menu -->
  <div id="exportMenu">
    <button class="menu-btn" id="btnExportPNG">PNG Image</button>
    <button class="menu-btn" id="btnExportMeasurements">Measurements (JSON)</button>
    <button class="menu-btn" id="btnExportContacts">Contacts (CSV)</button>
  </div>

  <script src="/static/lib/three.min.js"></script>
  <script src="/static/lib/OrbitControls.js"></script>
  <script src="/static/js/ballstick_viewer.js?v=1762853738"></script>
  <script>
    // Add button event listeners
    document.getElementById('btnToggleRMSF').addEventListener('click', () => {
      const btn = document.getElementById('btnToggleRMSF');
      btn.textContent = btn.textContent === 'Show RMSF' ? 'Show Hotspots' : 'Show RMSF';
      window.toggleRMSFColoring();
    });

    document.getElementById('btnToggleContacts').addEventListener('click', () => {
      const btn = document.getElementById('btnToggleContacts');
      btn.textContent = btn.textContent === 'Show Contacts' ? 'Hide Contacts' : 'Show Contacts';
      window.toggleContactNetwork();
    });

    document.getElementById('btnShowContacts').addEventListener('click', () => {
      window.showTopContacts();
    });

    document.getElementById('closeContactsBtn').addEventListener('click', () => {
      document.getElementById('contactsPanel').style.display = 'none';
    });
    
    // Phase 3: Clipping controls
    document.getElementById('btnToggleClipping').addEventListener('click', () => {
      const btn = document.getElementById('btnToggleClipping');
      const enabled = window.toggleClipping();
      btn.textContent = enabled ? 'Disable Clipping' : 'Enable Clipping';
      document.getElementById('clipPlaneControls').style.display = enabled ? 'block' : 'none';
    });
    
    document.getElementById('clip1Axis').addEventListener('change', (e) => {
      window.updateClipPlane(0, e.target.value, parseFloat(document.getElementById('clip1Slider').value));
    });
    
    document.getElementById('clip1Slider').addEventListener('input', (e) => {
      const value = parseFloat(e.target.value);
      document.getElementById('clip1Value').textContent = value.toFixed(1);
      const axis = document.getElementById('clip1Axis').value;
      window.updateClipPlane(0, axis, value);
    });
    
    document.getElementById('btnAddPlane').addEventListener('click', () => {
      const index = window.addClipPlane();
      if (index >= 0) {
        console.log('Added clip plane', index);
      }
    });
    
    document.getElementById('btnResetPlanes').addEventListener('click', () => {
      window.resetClipPlanes();
      document.getElementById('clip1Slider').value = 0;
      document.getElementById('clip1Value').textContent = '0';
      document.getElementById('clip1Axis').value = 'y';
    });
    
    document.getElementById('chkPlaneHelpers').addEventListener('change', () => {
      window.togglePlaneHelpers();
    });
    
    document.getElementById('closeClipBtn').addEventListener('click', () => {
      document.getElementById('btnToggleClipping').click();
    });
    
    // Phase 3: Measurement controls
    document.getElementById('btnToggleMeasure').addEventListener('click', () => {
      const btn = document.getElementById('btnToggleMeasure');
      const isActive = window.toggleMeasurementMode();
      btn.textContent = isActive ? 'Stop Measuring' : 'Measure Distance';
      document.getElementById('measurementsPanel').style.display = isActive ? 'block' : 'none';
    });
    
    document.getElementById('btnClearMeasurements').addEventListener('click', () => {
      window.clearMeasurements();
    });
    
    document.getElementById('chkPersistMeasurements').addEventListener('change', () => {
      window.togglePersistMeasurements();
    });
    
    // Phase 3: Export controls
    document.getElementById('btnExport').addEventListener('click', () => {
      const menu = document.getElementById('exportMenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    });
    
    document.getElementById('btnExportPNG').addEventListener('click', () => {
      window.exportScreenshot('png');
      document.getElementById('exportMenu').style.display = 'none';
    });
    
    document.getElementById('btnExportMeasurements').addEventListener('click', () => {
      window.exportMeasurements();
      document.getElementById('exportMenu').style.display = 'none';
    });
    
    document.getElementById('btnExportContacts').addEventListener('click', () => {
      window.exportContactsData();
      document.getElementById('exportMenu').style.display = 'none';
    });
    
    // Close export menu when clicking outside
    document.addEventListener('click', (e) => {
      const menu = document.getElementById('exportMenu');
      const btn = document.getElementById('btnExport');
      if (menu.style.display === 'block' && !menu.contains(e.target) && e.target !== btn) {
        menu.style.display = 'none';
      }
    });
  </script>
</body>
</html>
