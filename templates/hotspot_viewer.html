<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Molecular Visualizer • Dynamic Hotspots</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body { background: #0f1012; color: #e9eaee; font-family: system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, sans-serif; }
      .wrap { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
      h1 { margin: 0 0 6px; font-weight: 700; letter-spacing: .2px; }

      .modebar { display: inline-flex; gap: 6px; margin: 6px 0 10px; background:#16181d; border:1px solid #2b2f3a; border-radius:10px; padding:6px; }
      .modebar a { text-decoration:none; color:#c9ceda; font:12px/1 monospace; padding:6px 10px; border-radius:8px; }
      .modebar a.active { background:#263043; color:#fff; }
      .modebar a:hover { background:#20232a; }

      .meta { display: inline-block; padding: 6px 10px; border-radius: 10px; background: #1a1c22; border: 1px solid #2b2f3a; font-size: 12px; color: #b9beca; margin: 4px 0 14px; }

      .controls { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; margin: 8px 0 12px; }
      .btn { padding: 8px 12px; border: 1px solid #2b2f3a; background: #1a1c22; color: #e9eaee; border-radius: 8px; cursor: pointer; font-weight: 600; }
      .btn:hover { background: #22262f; }
      .btn:disabled { opacity: .6; cursor: default; }

      .slider-wrap { display: flex; gap: 10px; align-items: center; }
      input[type="range"] { width: 100%; }

      .viewer { position: relative; background: #0b0c0f; border: 1px solid #2b2f3a; border-radius: 10px; height: min(72vh, 680px); display: block; overflow: hidden; }
      #viewerCanvas { width: 100%; height: 100%; display: block; }

      /* Legend (blue → white → red) */
      #legend { position: absolute; right: 16px; bottom: 16px; width: 220px; user-select: none; background: rgba(18,20,24,.55); backdrop-filter: blur(4px); border: 1px solid #3a3f4a; border-radius: 8px; padding: 10px; }
      #legend .title { font: 12px/1.3 monospace; color: #c9ceda; margin-bottom: 6px; }
      #legendBar { height: 12px; border: 1px solid #555; background: linear-gradient(to right, #0000ff, #4fa9ff, #ffffff, #ffb6c1, #ff6666, #8b0000); border-radius: 2px; }
      #legend .ticks { display: flex; justify-content: space-between; font: 11px/1.2 monospace; color: #aeb4c2; margin-top: 4px; }

      /* Tooltip */
      #tooltip { position: absolute; pointer-events: none; z-index: 10; padding: 8px 10px; background: #1f232b; color: #e8e8ea; border: 1px solid #3a3f4a; border-radius: 8px; font: 12px/1.35 monospace; display: none; max-width: 320px; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,.35); }

      .status { margin-top: 8px; font: 12px/1.3 monospace; color: #9aa3b2; }

      /* Atom Info Panel */
      #infoPanel {
        position: absolute;
        top: 80px;
        right: 20px;
        width: 360px;
        max-height: calc(100vh - 120px);
        background: rgba(26, 28, 34, 0.95);
        border: 1px solid #2b2f3a;
        border-radius: 10px;
        padding: 16px;
        display: none;
        z-index: 100;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        overflow-y: auto;
      }
      
      .atom-info-panel h3 {
        margin: 0 0 12px 0;
        color: #e9eaee;
        font-size: 16px;
        font-weight: 600;
      }
      
      .info-section {
        margin-bottom: 12px;
        color: #b9beca;
        font-size: 13px;
        line-height: 1.5;
      }
      
      .info-section strong {
        color: #e9eaee;
        display: block;
        margin-bottom: 4px;
      }
      
      .close-btn {
        width: 100%;
        padding: 8px;
        margin-top: 8px;
        background: #263043;
        color: #fff;
        border: 1px solid #2b2f3a;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
      }
      
      .close-btn:hover {
        background: #2d3a4f;
      }

      /* Metric Selector */
      .metric-selector {
        margin: 12px 0;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      
      .metric-selector label {
        font: 13px/1 monospace;
        color: #c9ceda;
        font-weight: 600;
      }
      
      .metric-selector select {
        padding: 8px 12px;
        background: #1a1c22;
        color: #e9eaee;
        border: 1px solid #2b2f3a;
        border-radius: 8px;
        font: 13px/1 monospace;
        cursor: pointer;
        min-width: 180px;
      }
      
      .metric-selector select:hover {
        background: #22262f;
      }
      
      .metric-info {
        font: 12px/1.4 sans-serif;
        color: #9aa3b2;
        font-style: italic;
      }

      /* Timeline Heatmap */
      .timeline-heatmap {
        margin: 16px 0;
        background: #16181d;
        border: 1px solid #2b2f3a;
        border-radius: 8px;
        padding: 12px;
      }
      
      .timeline-heatmap h4 {
        margin: 0 0 8px 0;
        font: 13px/1 monospace;
        color: #c9ceda;
        font-weight: 600;
      }
      
      #heatmapCanvas {
        width: 100%;
        height: 60px;
        display: block;
        border: 1px solid #2b2f3a;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Molecular Visualizer</h1>

      <div class="modebar">
        <a class="active" href="/viewer">Points</a>
        <a href="/viewer/ballstick">Ball-and-Stick</a>
        <a href="/viewer/ribbon">Ribbon</a>
      </div>

      <div class="meta" id="metaPill">frames: — • atoms: — • residues: —</div>

      <!-- Metric Selector -->
      <div class="metric-selector">
        <label for="metricSelect">Metric:</label>
        <select id="metricSelect">
          <option value="hotspot">Dynamic Hotspot</option>
          <option value="anomaly">Dynamic Anomaly</option>
          <option value="rmsf">RMSF (Flexibility)</option>
          <option value="tica">tICA Importance</option>
        </select>
        <span class="metric-info" id="metricInfo">Visualize dynamic regions of interest</span>
      </div>

      <!-- Timeline Heatmap -->
      <div class="timeline-heatmap">
        <h4>Timeline Overview</h4>
        <canvas id="heatmapCanvas"></canvas>
      </div>

      <div class="controls">
        <div class="slider-wrap">
          <span style="opacity:.75; font: 12px/1 monospace;">frame</span>
          <input id="frameSlider" type="range" min="0" max="0" step="1" value="0" />
          <span id="frameLabel" style="min-width: 28px; text-align: right; font: 12px/1 monospace;">0</span>
        </div>
        <button class="btn" id="btnLoad">Load frame 0</button>
        <button class="btn" id="btnPlay">Play</button>
        <button class="btn" id="btnPause" disabled>Pause</button>
        <!-- Playback Speed Control -->
        <div style="display:flex;gap:6px;align-items:center">
          <span style="opacity:.75;font:11px/1 monospace">Speed:</span>
          <input id="speedSlider" type="range" min="0.25" max="2" step="0.25" value="0.5" style="width:80px;" />
          <span id="speedLbl" style="min-width:32px;font:11px/1 monospace">0.5x</span>
        </div>
      </div>

      <!-- Colormap Selector -->
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
        <label for="colormapSelect" style="font:12px/1 monospace;color:#c9ceda;">Colormap:</label>
        <select id="colormapSelect" style="padding:6px 10px;background:#1a1c22;color:#e9eaee;border:1px solid #2b2f3a;border-radius:6px;font:12px/1 monospace;cursor:pointer;">
          <option value="viridis">Viridis (colorblind safe)</option>
          <option value="plasma">Plasma (warm)</option>
          <option value="coolwarm">Cool-Warm (diverging)</option>
          <option value="rainbow">Rainbow</option>
          <option value="bwr">Blue-White-Red (original)</option>
        </select>
      </div>

      <div class="viewer">
        <canvas id="viewerCanvas"></canvas>

        <!-- Legend -->
        <div id="legend">
          <div class="title" id="legendTitle">Dynamic Hotspot</div>
          <div id="legendBar"></div>
          <div class="ticks">
            <span id="legendMin">0.00</span><span>0.50</span><span id="legendMax">1.00</span>
          </div>
          <div style="margin-top: 8px; font: 11px/1.3 sans-serif; color: #9aa3b2;" id="legendDesc">
            High values indicate regions of interest
          </div>
        </div>

        <div id="tooltip"></div>
      </div>

      <div class="status" id="status">initializing…</div>
    </div>

    <!-- Atom Info Panel -->
    <div id="infoPanel"></div>

    <script src="/static/lib/three.min.js"></script>
    <script src="/static/lib/OrbitControls.js"></script>
    <script src="/static/js/simple_visualizer.js?v=1762853739"></script>
    <script>
      // Playback speed control
      document.getElementById('speedSlider').addEventListener('input', (e) => {
        const speed = parseFloat(e.target.value);
        document.getElementById('speedLbl').textContent = speed + 'x';
        if (window.setPlaybackSpeed) {
          window.setPlaybackSpeed(speed);
        }
      });

      // Colormap selector
      document.getElementById('colormapSelect').addEventListener('change', async (e) => {
        const colormap = e.target.value;
        if (window.setColormap) {
          window.setColormap(colormap);
          // Reload current frame to apply new colormap
          const slider = document.getElementById('frameSlider');
          const currentFrame = parseInt(slider.value, 10);
          // Re-apply colors by triggering metric reload
          const metricSelect = document.getElementById('metricSelect');
          const event = new Event('change');
          metricSelect.dispatchEvent(event);
        }
      });
    </script>
  </body>
</html>
