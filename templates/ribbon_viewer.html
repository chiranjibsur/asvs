<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Trame Ribbon Viewer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .viewer-frame {
        flex: 1;
        border: none;
        width: 100%;
        height: 100%;
        background: #05060a;
      }
      .fallback {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #b5bccb;
        gap: 8px;
      }
      .fallback code {
        font-weight: 600;
        color: #f1f3ff;
        background: rgba(255,255,255,0.08);
        padding: 2px 6px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    {% if ribbon_server_url %}
    <iframe
      class="viewer-frame"
      src="{{ ribbon_server_url }}"
      title="VTK Ribbon Viewer"
      loading="lazy"
      allowfullscreen
    ></iframe>
    {% else %}
    <div class="fallback">
      <h2>Ribbon Viewer Unavailable</h2>
      <p>Unable to determine Trame ribbon server URL.</p>
      <p>Please restart the Flask app or run <code>python trame_ribbon_app.py</code>.</p>
    </div>
    {% endif %}
  </body>
</html>
